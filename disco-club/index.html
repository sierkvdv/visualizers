<script>
const $ = id => document.getElementById(id);
const status = $('status');
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const TAU = Math.PI * 2;

// --- Instellingen ---
const clubPrefsQuery=new URLSearchParams(location.search);
const clubPrefsAvatar=!['uitzenden','cast','regie'].some(k=>clubPrefsQuery.has(k))&&(location.pathname.startsWith('/live/')||clubPrefsQuery.has('wandelen')||clubPrefsQuery.get('live')==='1');
const clubPrefsKey=clubPrefsAvatar?'discoclub-avatar':'discoclub';
const S = { count: 9, cast: 'mix', cam: 'auto', sens: 1, strobe: 'soms', smoke: 0.6, mono: false, auto: 0, fb: 0, mirror: false, floor: 'auto', visual: 'uit' };
try { Object.assign(S, JSON.parse(localStorage.getItem(clubPrefsKey) || '{}')); } catch (e) {}
if (!S.sporenUitWillekeur) { S.fb = 0; S.sporenUitWillekeur = 1; }  // eenmalig: sporen die de willekeur ooit bewaarde weer uit (horen bij zaal 2)
if (!['uit', 'weinig', 'soms', 'vaak'].includes(S.strobe)) S.strobe = S.strobe === 'vol' ? 'vaak' : 'soms';
const strobeZacht = () => S.strobe === 'weinig' ? 0.5 : 1;  // 'heel soms': halve sterkte, zeldzamer en korter
function save() { try { localStorage.setItem(clubPrefsKey, JSON.stringify(S)); } catch (e) {} }

// Kwaliteit: club/kwaliteit.js kiest hoog/midden/laag en zet KW; deze beginwaarden zijn 'hoog' (zoals altijd)
const MOBIEL = matchMedia('(pointer: coarse)').matches || /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent);
const KW = { stand: 'hoog', schaduw: 2, bol: 4, spiegel: true, imag: 3, spiegelElke: 2, bolFiguren: false };  // schaduw/bol/imag/spiegelElke: om de hoeveel beelden (0 = nooit); zie teken()

// --- Scène ---
// Telefoons: botstanden als uniforms i.p.v. een float-textuur per figuur. Die textuur gaat elke render opnieuw naar de GPU
// (43 figuren x spiegel/bol = ~100 uploads per beeld); op iPhone-Safari is dat traag. three r128 kiest dit alleen bij het
// aanmaken (vertexTextures), dus de context meldt dan even 0 vertex-textuureenheden. Antialias kan ook alleen hier.
// Met nabewerking tekent de composer de zaal in eigen buffers en krijgt het canvas alleen het eindbeeld (FXAA zit in de grade):
// dan geen MSAA, diepte of stencil op het canvas (scheelt de gpu geheugen en bandbreedte, beeld blijft gelijk).
// high-performance: op een MacBook Pro 15" met twee gpu's de Radeon i.p.v. de Intel.
const NABEWERKING = !!(THREE.EffectComposer && THREE.UnrealBloomPass);
const renderer = (() => {
  if (!MOBIEL) return new THREE.WebGLRenderer({ antialias: !NABEWERKING, depth: !NABEWERKING, stencil: !NABEWERKING, powerPreference: 'high-performance' });
  const cv = document.createElement('canvas'), attrs = { alpha: false, depth: !NABEWERKING, stencil: !NABEWERKING, antialias: false, premultipliedAlpha: true, preserveDrawingBuffer: false, powerPreference: 'high-performance' };
  const ctx = cv.getContext('webgl2', attrs) || cv.getContext('webgl', attrs);
  if (!ctx) return new THREE.WebGLRenderer({ antialias: false });
  const gp = ctx.getParameter;
  ctx.getParameter = function (p) { return p === 35660 ? 0 : gp.call(this, p); };  // MAX_VERTEX_TEXTURE_IMAGE_UNITS
  try { return new THREE.WebGLRenderer({ canvas: cv, context: ctx }); } finally { ctx.getParameter = gp; }
})();
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;  // één keer per frame, niet bij elke spiegel- en bol-opname opnieuw
// De resolutie regelen we zelf (PR), zodat renderer en bloom-keten exact dezelfde pixelmaten gebruiken
let PR = Math.min(window.devicePixelRatio || 1, 1.5);  // midden/laag: lager (club/kwaliteit.js)
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05030a, 0.021);
const camera = new THREE.PerspectiveCamera(55, 1, 0.2, 100);  // near niet lager: vloerlagen liggen millimeters uit elkaar

let composer = null, bloom = null, grade = null, feedback = null;
if (NABEWERKING) {
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  // Visuele feedback: het vorige beeld blijft, iets gezoomd en gedraaid, als spoor hangen. Ook het spiegeleffect zit hierin.
  feedback = new THREE.Pass();
  feedback.material = new THREE.ShaderMaterial({
    uniforms: { tNew: { value: null }, tOld: { value: null }, amount: { value: 0 }, zoom: { value: 1.02 }, rotA: { value: 0 }, mirror: { value: 0 }, aspect: { value: 1 } },
    vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `uniform sampler2D tNew, tOld; uniform float amount, zoom, rotA, mirror, aspect; varying vec2 vUv;
      void main() {
        vec2 uv = vUv;
        if (mirror > 0.5 && uv.x > 0.5) uv.x = 1.0 - uv.x;
        vec3 c = texture2D(tNew, uv).rgb;
        vec2 q = vUv - 0.5;
        q.x *= aspect;
        float cs = cos(rotA), sn = sin(rotA);
        q = mat2(cs, -sn, sn, cs) * q / zoom;
        q.x /= aspect;
        float inside = step(abs(q.x), 0.5) * step(abs(q.y), 0.5);
        gl_FragColor = vec4(max(c, texture2D(tOld, q + 0.5).rgb * amount * inside), 1.0);
      }`,
  });
  feedback.quad = new THREE.FullScreenQuad(feedback.material);
  feedback.copy = new THREE.FullScreenQuad(new THREE.MeshBasicMaterial());
  feedback.rtA = new THREE.WebGLRenderTarget(4, 4);
  feedback.rtB = new THREE.WebGLRenderTarget(4, 4);
  feedback.setSize = function (w, h) { this.rtA.setSize(w, h); this.rtB.setSize(w, h); this.material.uniforms.aspect.value = w / h; };
  feedback.render = function (renderer, writeBuffer, readBuffer) {
    const u = this.material.uniforms;
    u.tNew.value = readBuffer.texture;
    u.tOld.value = this.rtA.texture;
    renderer.setRenderTarget(this.rtB);
    this.quad.render(renderer);
    this.copy.material.map = this.rtB.texture;
    renderer.setRenderTarget(this.renderToScreen ? null : writeBuffer);
    this.copy.render(renderer);
    [this.rtA, this.rtB] = [this.rtB, this.rtA];
  };
  composer.addPass(feedback);
  bloom = new THREE.UnrealBloomPass(new THREE.Vector2(1, 1), 0.6, 0.5, 0.72);
  composer.addPass(bloom);
  // eindbewerking: kartelranden gladstrijken (FXAA), filmische contrastcurve, vignet en een beetje korrel
  grade = new THREE.ShaderPass({
    uniforms: { tDiffuse: { value: null }, res: { value: new THREE.Vector2(1, 1) }, time: { value: 0 }, mono: { value: 0 } },
    vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `uniform sampler2D tDiffuse; uniform vec2 res; uniform float time; uniform float mono; varying vec2 vUv;
      const vec3 LUMA = vec3(0.299, 0.587, 0.114);
      vec3 fxaa(vec2 uv) {
        vec2 px = 1.0 / res;
        vec3 nw = texture2D(tDiffuse, uv + vec2(-1.0, -1.0) * px).rgb, ne = texture2D(tDiffuse, uv + vec2(1.0, -1.0) * px).rgb;
        vec3 sw = texture2D(tDiffuse, uv + vec2(-1.0, 1.0) * px).rgb, se = texture2D(tDiffuse, uv + vec2(1.0, 1.0) * px).rgb;
        vec3 m = texture2D(tDiffuse, uv).rgb;
        float lnw = dot(nw, LUMA), lne = dot(ne, LUMA), lsw = dot(sw, LUMA), lse = dot(se, LUMA), lm = dot(m, LUMA);
        float lmin = min(lm, min(min(lnw, lne), min(lsw, lse))), lmax = max(lm, max(max(lnw, lne), max(lsw, lse)));
        vec2 dir = vec2(-((lnw + lne) - (lsw + lse)), (lnw + lsw) - (lne + lse));
        float reduce = max((lnw + lne + lsw + lse) * 0.03125, 0.0078125);
        dir = clamp(dir / (min(abs(dir.x), abs(dir.y)) + reduce), -8.0, 8.0) * px;
        vec3 a = 0.5 * (texture2D(tDiffuse, uv + dir * (1.0 / 3.0 - 0.5)).rgb + texture2D(tDiffuse, uv + dir * (2.0 / 3.0 - 0.5)).rgb);
        vec3 b = a * 0.5 + 0.25 * (texture2D(tDiffuse, uv - dir * 0.5).rgb + texture2D(tDiffuse, uv + dir * 0.5).rgb);
        float lb = dot(b, LUMA);
        return (lb < lmin || lb > lmax) ? a : b;
      }
      void main() {
        vec3 c = fxaa(vUv) * 1.22;
        c = c * (2.51 * c + 0.03) / (c * (2.43 * c + 0.59) + 0.14);
        c = mix(vec3(dot(c, LUMA)), c, 1.18);
        c = mix(c, vec3(smoothstep(0.02, 0.9, dot(c, LUMA) * 1.25)), mono);  // zwart-wit met wat extra contrast
        vec2 q = vUv - 0.5;
        c *= 1.0 - 0.9 * dot(q, q);
        c += (fract(sin(dot(vUv * res + time * 61.0, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) * 0.03;
        gl_FragColor = vec4(c, 1.0);
      }`,
  });
  composer.addPass(grade);
}
function resize() {
  const w = Math.floor(innerWidth * PR), h = Math.floor(innerHeight * PR);
  renderer.setSize(w, h, false);
  if (composer) composer.setSize(w, h);
  if (grade) grade.uniforms.res.value.set(w, h);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const NEON = [0xff2d95, 0x00e5ff, 0xffe600, 0x7cff00, 0xb967ff, 0xff6b00].map(c => new THREE.Color(c));
const white = new THREE.Color(0xffffff), tmpColor = new THREE.Color(), m4 = new THREE.Matrix4();
const SPH = new THREE.SphereGeometry(1, 20, 14), BOX = new THREE.BoxGeometry(1, 1, 1), CYL = new THREE.CylinderGeometry(1, 1, 1, 16), CONE = new THREE.ConeGeometry(1, 1, 20);
const additive = (color, opacity = 1) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false });
// Mesh met positie/schaal in één regel
function add(parent, geo, mat, pos, scl) {
  const m = new THREE.Mesh(geo, mat);
  if (pos) m.position.set(pos[0], pos[1], pos[2]);
  if (scl) m.scale.set(scl[0], scl[1], scl[2]);
  parent.add(m);
  return m;
}

// Zaal: donkere doos om de dansvloer
const ROOM = 14, CEIL = 7;
function samenvoegen(geos) {  // geometrieën met dezelfde attributen en een index tot één (vaste vlakken die één materiaal delen)
  const uit = new THREE.BufferGeometry(), index = [];
  let v = 0;
  for (const k of Object.keys(geos[0].attributes)) {
    const a = geos[0].attributes[k], arr = new Float32Array(geos.reduce((n, g) => n + g.attributes[k].count, 0) * a.itemSize);
    let o = 0;
    for (const g of geos) { arr.set(g.attributes[k].array, o); o += g.attributes[k].array.length; }
    uit.setAttribute(k, new THREE.BufferAttribute(arr, a.itemSize));
  }
  for (const g of geos) { for (let i = 0; i < g.index.count; i++) index.push(g.index.getX(i) + v); v += g.attributes.position.count; g.dispose(); }
  uit.setIndex(index);
  return uit;
}
function canvasTexture(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); return new THREE.CanvasTexture(c); }
// wand: ruw beton met naden, vochtplekken, roestvegen en graffiti (underground)
const wallTex = canvasTexture(1024, 512, (g, w, h) => {
  g.fillStyle = '#3a3836'; g.fillRect(0, 0, w, h);
  const img = g.getImageData(0, 0, w, h), d = img.data;  // korrel
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - 0.5) * 34; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(img, 0, 0);
  for (let i = 0; i < 40; i++) {  // vlekken en vocht
    const x = rnd(0, w), y = rnd(0, h), r = rnd(20, 140), gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, pick(['rgba(10,10,12,0.35)', 'rgba(70,45,25,0.22)', 'rgba(255,255,255,0.05)'])); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  for (let i = 0; i < 26; i++) {  // druipsporen naar beneden
    const x = rnd(0, w), y = rnd(0, h * 0.5), gr = g.createLinearGradient(0, y, 0, y + rnd(60, 220));
    gr.addColorStop(0, 'rgba(15,12,10,0.35)'); gr.addColorStop(1, 'rgba(15,12,10,0)');
    g.fillStyle = gr; g.fillRect(x, y, rnd(2, 7), 240);
  }
  g.strokeStyle = 'rgba(0,0,0,0.45)'; g.lineWidth = 2;  // bekistingsnaden
  for (let x = 0; x <= w; x += 256) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
  for (const y of [170, 340]) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
  for (let x = 32; x < w; x += 128) for (const y of [85, 255, 425]) { g.fillStyle = 'rgba(0,0,0,0.5)'; g.beginPath(); g.arc(x, y, 3, 0, 7); g.fill(); }
  // graffiti: snelle tags in spuitbuskleuren
  g.lineCap = 'round'; g.lineJoin = 'round';
  for (let t = 0; t < 7; t++) {
    const cx = rnd(60, w - 160), cy = rnd(150, h - 60), col = pick(['#ff2d95', '#00e5ff', '#e8ff3c', '#ffffff', '#ff6a00', '#9b6bff']);
    g.strokeStyle = col; g.globalAlpha = rnd(0.35, 0.7); g.lineWidth = rnd(3, 7); g.shadowColor = col; g.shadowBlur = 6;
    g.beginPath(); let x = cx, y = cy; g.moveTo(x, y);
    for (let k = 0; k < 14; k++) { const nx = x + rnd(8, 22), ny = cy + rnd(-34, 18); g.quadraticCurveTo(x + rnd(-14, 14), y + rnd(-40, 40), nx, ny); x = nx; y = ny; }
    g.stroke();
    if (Math.random() < 0.5) { g.lineWidth = 2; g.beginPath(); g.moveTo(cx - 6, cy + 14); g.lineTo(x + 10, cy + 10); g.stroke(); }
  }
  g.globalAlpha = 1; g.shadowBlur = 0;
  g.fillStyle = 'rgba(8,8,10,0.85)'; g.fillRect(0, h * 0.86, w, h * 0.14);  // vuile plint
});
wallTex.wrapS = wallTex.wrapT = THREE.RepeatWrapping;
wallTex.repeat.set(3, 1);
// muren: gegenereerde graffiti-muren (tex/graffiti-N.jpg); vloer en plafond (en zolang ze laden) het eigen beton
const concreteMat = new THREE.MeshStandardMaterial({ color: 0x8a8580, map: wallTex, roughness: 0.95, side: THREE.BackSide });
const wallMats = [0, 1, 2, 3].map(() => concreteMat);
const hiddenMat = new THREE.MeshBasicMaterial({ visible: false });
const room = add(scene, new THREE.BoxGeometry(ROOM * 2, CEIL, ROOM * 2), [wallMats[0], wallMats[1], concreteMat, concreteMat, hiddenMat, wallMats[3]], [0, CEIL / 2, 0]);
// voorwand los opgebouwd rond de deur naar de tweede zaal (x 8,15..9,85, tot 2,5 m hoog), met dezelfde uv als de doos-wand
const frontWall = [];
function frontWallPiece(x0, x1, y0, y1, mat) {

  BUNDEL[q] = o.x; BUNDEL[q + 1] = o.y; BUNDEL[q + 2] = o.z; BUNDEL[q + 3] = ax; BUNDEL[q + 4] = ay; BUNDEL[q + 5] = az;
  BUNDEL[q + 6] = l > 0 ? 1 / l : 0; BUNDEL[q + 7] = c.r * sterkte; BUNDEL[q + 8] = c.g * sterkte; BUNDEL[q + 9] = c.b * sterkte; BUNDEL[q + 10] = verval + kop * 100;
}
function bundelsLezen() {
  if (bundelBeeld === frameNo) return;
  bundelBeeld = frameNo;
  let k = 0;
  for (let i = 0; i < spots.length && k < 16; i++) { const s = spots[i]; bundelZet(k++, s.beam.g.position, s.beam.target, s.light.color, s.beam.mat.uniforms.strength.value, 0.35, 0); }
  for (let i = 0; i < heads.length && k < 16; i++) { const h = heads[i], u = h.beam.mat.uniforms; bundelZet(k++, h.beam.g.position, h.beam.target, u.color.value, u.strength.value, 1.4, 1); }
  bundelN = k;
}
function rookLicht(x, y, z, wSpot, wKop) {  // som van de bundels op plek x,y,z in rookR/G/B (spots x wSpot, moving heads x wKop)
  let r = 0, g = 0, b = 0;
  for (let k = 0; k < bundelN; k++) {
    const q = k * 11, ox = BUNDEL[q], oy = BUNDEL[q + 1], oz = BUNDEL[q + 2], ax = BUNDEL[q + 3], ay = BUNDEL[q + 4], az = BUNDEL[q + 5];
    let t = ((x - ox) * ax + (y - oy) * ay + (z - oz) * az) * BUNDEL[q + 6];
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const ex = ox + ax * t - x, ey = oy + ay * t - y, ez = oz + az * t - z, v = BUNDEL[q + 10], kop = v > 50;
    const w = (kop ? wKop : wSpot) * Math.exp(-(ex * ex + ey * ey + ez * ez) * (kop ? v - 100 : v));
    r += BUNDEL[q + 7] * w; g += BUNDEL[q + 8] * w; b += BUNDEL[q + 9] * w;
  }
  rookR = r; rookG = g; rookB = b;
}
function updateSmoke(dt) {
  bundelsLezen();
  const fl = strobeLight.intensity * 0.012, k = S.smoke * 1.6;
  for (let i = 0; i < puffs.length; i++) {
    const f = puffs[i], p = f.sp.position;
    p.x += f.vx * dt; p.z += f.vz * dt;
    if (Math.abs(p.x) > 9.5) f.vx *= -1;
    if (Math.abs(p.z) > 9.5) f.vz *= -1;
    f.sp.material.rotation += f.spin * dt;
    rookLicht(p.x, p.y, p.z, 0.55, 0.4);
    const r = 0.025 + rookR + fl, g = 0.022 + rookG + fl, b = 0.035 + rookB + fl;
    f.lit.setRGB(r, g, b);
    f.sp.material.color.setRGB(r * k, g * k, b * k);
  }
}

// Rookmachines: kastjes op de vloer die bij een climax (en om de 32 tellen) een straal rook de zaal in blazen
const FOGGERS = [[-2.6, -6.25, 0], [2.6, -6.25, 0], [-4, 6.8, Math.PI], [4, 6.8, Math.PI]].map(([x, z, ry]) => ({ x, z, dir: new THREE.Vector3(Math.sin(ry), 0, Math.cos(ry)) }));
const fogPool = [];
for (let i = 0; i < 180; i++) {  // laag (club/kwaliteit.js) houdt de helft over
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: smokeTex[i % 3], color: 0x000000, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, rotation: rnd(0, TAU) }));
  sp.visible = false; scene.add(sp);
  fogPool.push({ sp, v: new THREE.Vector3(), age: 0, life: 0, s0: 0, lit: new THREE.Color() });
}
let fogQueue = [], lastFogBeat = -99;
function fireFog(m, dur = 2.6) {  // een stoot van ~2,6 s: elke ~0,09 s een wolkje
  for (let t = 0; t < dur; t += 0.09) fogQueue.push({ m, at: performance.now() / 1000 + t });
}
function updateFog(dt, beat, energy) {
  // elke 16 tellen 2-3 machines tegelijk, en op hoge energie vaker een extra stoot
  if (beat !== lastFogBeat && beat % 16 === 8) { const k = 2 + Math.floor(Math.random() * 2); for (const m of FOGGERS.slice().sort(() => Math.random() - 0.5).slice(0, k)) fireFog(m); }
  if (beat !== lastFogBeat && energy > 0.65 && Math.random() < 0.08) fireFog(pick(FOGGERS), 1.6);
  lastFogBeat = beat;
  const now = performance.now() / 1000;
  let j = 0, vrij = 0;  // wachtrij op zijn plek inkorten (geen nieuwe lijst per beeld)
  for (let i = 0; i < fogQueue.length; i++) {
    const q = fogQueue[i];
    if (q.at > now) { fogQueue[j++] = q; continue; }
    while (vrij < fogPool.length && fogPool[vrij].sp.visible) vrij++;
    const f = fogPool[vrij];
    if (f) {
      const m = q.m;
      f.sp.visible = true; f.age = 0; f.life = rnd(8, 13); f.s0 = rnd(0.9, 1.3); f.green = false;
      f.sp.position.set(m.x + m.dir.x * 0.3, 0.35, m.z + m.dir.z * 0.3);
      f.v.copy(m.dir).multiplyScalar(rnd(4, 6));
      f.v.x += rnd(-0.6, 0.6); f.v.y += rnd(0.1, 0.5); f.v.z += rnd(-0.6, 0.6);
    }
  }
  fogQueue.length = j;
  bundelsLezen();
  const rem = Math.exp(-dt * 1.4), sk = 0.27 * (0.4 + S.smoke);
  for (let i = 0; i < fogPool.length; i++) {
    const f = fogPool[i];
    if (!f.sp.visible) continue;
    f.age += dt;
    if (f.age > f.life) { f.sp.visible = false; continue; }
    f.v.multiplyScalar(rem);  // remt af en blijft laag hangen
    const p = f.sp.position;
    p.x += f.v.x * dt; p.y += f.v.y * dt; p.z += f.v.z * dt;
    const sc = f.s0 + f.age * 1.55;
    f.sp.scale.set(sc * 1.4, sc, 1);
    let r, g, b;
    if (f.green) { r = 0.12; g = 0.42; b = 0.05; }  // boer van de slak
    else { rookLicht(p.x, p.y, p.z, 0.6, 0.45); r = 0.05 + rookR; g = 0.045 + rookG; b = 0.06 + rookB; }
    const peak = Math.max(r, g, b);
    if (peak > 0.3) { const q = 0.3 / peak; r *= q; g *= q; b *= q; }  // nooit een witte muur onder een felle spot (meer wolkjes = al voller)
    f.lit.setRGB(r, g, b);
    const fade = Math.min(1, f.age * 3) * (1 - f.age / f.life) * sk;
    f.sp.material.color.setRGB(r * fade, g * fade, b * fade);
  }
}

function speakerCone(parent, r, pos) {
  const c = new THREE.Object3D();
  c.position.set(pos[0], pos[1], pos[2]);
  c.rotation.x = Math.PI / 2;
  c.userData.r = r;
  parent.add(c);
  c.updateWorldMatrix(true, false);  // meteen goed (het eerste beeld tekent vóór de eerste matrix-update)
  kapLokaal.push(new THREE.Matrix4().makeTranslation(0, -r * 0.2, 0).multiply(new THREE.Matrix4().makeScale(r * 0.32, r * 0.12, r * 0.32)));

}
function pompen(k) {  // schaal k op alle conussen (met stofkap)
  for (let i = 0; i < speakers.length; i++) {
    const c = speakers[i], r = c.userData.r;
    m4.copy(c.matrixWorld).scale(pompV.set(k * r, k * r, k * r));
    conussen.setMatrixAt(i, m4);
    m4.copy(c.matrixWorld).scale(pompV.set(k, k, k)).multiply(kapLokaal[i]);
    kappen.setMatrixAt(i, m4);
  }

}

function capsule(r0, r1, len) {  // afgeronde, taps toelopende buis van y=0 naar y=-len
  const key = [r0, r1, len].map(x => x.toFixed(3)).join();
  if (geoCache[key]) return geoCache[key];

  for (let i = 0; i <= 5; i++) { const a = Math.PI / 2 * i / 5; pts.push(new THREE.Vector2(Math.max(1e-4, r1 * Math.sin(a)), -len - r1 * Math.cos(a))); }

  { name: 'heads',  w: 2,   spots: 0.15, heads: 1.3, lasers: 0, floor: 0.35, flecks: 0.5, wash: 0.3, forms: [2, 3, 4, 0] },

let cue = CUES[0], palTarget = PALETTES[0], cueFractal = false, floorKind = 0, wallKind = 1;

const spiegelPos = new THREE.Vector3(), spiegelRicht = new THREE.Vector3(), kijkRicht = new THREE.Vector3();
// Klein spul (straal < 0,2 m: glazen, flesjes, sigaretten, dopjes, kleine rommel) alleen in het hoofdbeeld: in de vervaagde spiegel (512 px)
// en de bol (128 px) zie je het niet, maar elk kost een draw. Laag 2 ziet alleen de hoofdcamera (spiegel, bol en de ledwand-camera kijken
// naar laag 0). Van gebouwde figuren (robots, aliens) alleen de kleinste delen (< 0,12 m: handen, vingers), de rest blijft in het
// spiegelbeeld; wat licht geeft ook (lampjes, gloeiringen, sigarettenpuntjes, lichtgevende drankjes en additieve gloed: een felle stip blijft
// vervaagd in de vloer zichtbaar).
// Eén keer per object, vóór club/optimaliseer.js samenvoegt (die deelt per laag in). TEKENLAAG.klein = false: weer overal (vergelijken).
const L_KLEIN = 2, KLEIN_R = 0.2, KLEIN_FIG = 0.12, TEKENLAAG = { klein: true };
camera.layers.enable(L_KLEIN);
const kleinGezien = new WeakSet(), kleinBol = new THREE.Sphere();
let kleinGrens = KLEIN_R;
function kleinObject(o) {
  if (kleinGezien.has(o)) return;

  const g = o.geometry, m = Array.isArray(o.material) ? o.material[0] : o.material;
  if (!g || !g.attributes || !g.attributes.position || !m || m.blending === THREE.AdditiveBlending) return;

}
function kleinIndelen() {
  const gebouwd = new Set();
  for (const lijst of [dancers, crowd, walkers, poleDancers, zone2Dancers]) for (const d of lijst) if (d.type !== 'model') gebouwd.add(d.root);
  if (dj && dj.type !== 'model') gebouwd.add(dj.root);
  for (const c of scene.children) {

// Lampen blijven in elke pass aan: een ander aantal lampen geeft three andere shaders (hercompileren / wisselen per pass).
// Een groep met een lamp erin gaat dus niet als geheel uit, alleen de delen zonder lamp.
function zonderLamp(o, uit) {

}
// bol en spiegel: geen zaal 2 (achter de voorwand); bol ook niet wat verder dan 60 m staat (doolhof; verder dan het verre vlak van de

// bolKaal: ook zonder figuren (KW.bolFiguren false, alle standen); scheelt ook het doorlopen van alle botten per zijde.
function lijsten() {
  bolUit.length = 0; bolKaalUit.length = 0; spiegelUit.length = 0;
  zonderLamp(zone2, spiegelUit);
  for (const c of scene.children) {
    if (c === zone2 || c.isLight || c.isSprite) continue;
    if (Math.abs(c.position.x) > 60 || Math.abs(c.position.z) > 60) { zonderLamp(c, bolUit); continue; }
    // figuur (met of zonder lamp erin) één keer bepalen: niet elke keer alle botten doorlopen
    let f = figuurTop.get(c);

  bolUit.push(...spiegelUit);

  // (WebGL weigert die draws, 'feedback loop'), dus daar even uit: zelfde bol, minder draws en geen GL-fouten. Samengevoegde meshes zelf

  bolEnv.length = 0;

  for (const c of scene.children) {
    if (c === zone2 || c.isLight || figuurTop.get(c) || Math.abs(c.position.x) > 60 || Math.abs(c.position.z) > 60) continue;
    c.traverse(o => { if (o.isMesh && o.layers.mask !== 0 && envGebruiker(o.material)) bolEnv.push(o); });

// wie er direct in de scène en in zaal 2 hangt: aantal + som van de ids (een nieuwe bezetting vervangt figuren zonder dat het aantal verandert)
function lijstSig() {
  const ch = scene.children;
  let s = ch.length * 7919 + zone2.children.length * 104729;
  for (let i = 0; i < ch.length; i++) s += ch[i].id;
  return s;
}
function bijLijsten() { if (lijstSig() !== lijstN ? lijstTel++ % 10 === 0 : lijstTel++ % 300 === 0) lijsten(); }
function uitZetten(lijst, w) { for (let i = 0; i < lijst.length; i++) { w[i] = lijst[i].visible; lijst[i].visible = false; } }

function bolOpname(zijden) {
  // nieuwe objecten (laden, nieuwe bezetting, samenvoegingen van club/optimaliseer.js) meteen indelen, niet pas bij de 10e beurt van
  // bijLijsten: anders tekent de bol een tijd lang figuren en dingen met zijn eigen opname als envMap (WebGL weigert ze, GL-fouten)
  if (lijstSig() !== lijstN) lijsten();
  const uit = KW.bolFiguren === false ? bolKaalUit : bolUit;
  uitZetten(uit, was);
  uitZetten(bolEnv, wasEnv);
  const bv = ball.visible, mv = mirror.visible, prev = renderer.getRenderTarget(), mip = envRT.texture.generateMipmaps;
  ball.visible = false; mirror.visible = false;

    for (let k = 0; k < zijden; k++) {

// Spiegel-opname bovenaan in teken(), niet genest vanuit de hoofdrender (Reflector.onBeforeRender): three geeft elke render-diepte eigen

const spiegelKern = mirror.isReflector ? mirror.onBeforeRender : null;

let spiegelCam = null;  // de camera van de Reflector (zit in zijn closure), voor de lagen
function spiegelKernRender() {
  if (spiegelCam) { spiegelCam.layers.mask = TEKENLAAG.klein ? 1 : 1 | 1 << L_KLEIN; spiegelKern.call(mirror, renderer, scene, camera); return; }

function spiegelOpname(druk) {  // true als er deze keer een opname is gemaakt; druk: dit beeld is al zwaar (zie teken)
  if (!spiegelKern || !mirror.visible) { spiegelOud = 99; return false; }

  const sprong = !(camera.position.distanceToSquared(spiegelPos) < 0.25 && kijkRicht.dot(spiegelRicht) > 0.985 && Math.abs(camera.fov - spiegelFov) < 2);

function teken() {

  // een beeld later (hooguit één keer uitstellen), zodat zo'n beeld niet ook nog de duurste pass krijgt
  const druk = KW.spiegelElke > 1 && renderer.info.render.calls > 40;

  // spiegel, hoofdbeeld en bolzijden zijn samen één beeld: wie aan scene.onBefore/AfterRender hangt (club/optimaliseer.js) ziet één

    const p = camera.position, inZaal1 = Math.abs(p.x) < ROOM + 0.5 && Math.abs(p.z) < ROOM + 0.5;

    if (zone2.visible && inZaal1 && !zicht.intersectsBox(deurDoos)) { uitZetten(spiegelUit, wasZ2); z2weg = true; }

    if (z2weg) { z2weg = false; terugZetten(spiegelUit, wasZ2); }

addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey) return;

  if (inControl && e.key.startsWith('Arrow')) return;
  const k = e.key.toLowerCase();
  if (k === 'h') $('ui').classList.toggle('hidden');
  if (k === 'f') $('btnFull').click();
  if (k === 'n') buildCast();  // nieuwe bezetting
  if (k === 'b') { S.mono = !S.mono; syncUI(); save(); }
