<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SamSo Disco Club</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 13px -apple-system, system-ui, sans-serif; color: #ddd; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui { position: fixed; left: 16px; top: 16px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; max-width: calc(100vw - 32px); box-sizing: border-box;
        background: rgba(0,0,0,.6); padding: 10px 12px; border-radius: 10px; backdrop-filter: blur(8px); transition: opacity .4s; }
  #ui.hidden { opacity: 0; pointer-events: none; }
  button, select { font: inherit; color: #eee; background: #222; border: 1px solid #444; border-radius: 6px; padding: 5px 9px; cursor: pointer; }
  button:hover { background: #333; }
  label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 90px; height: 4px; background: #555; border-radius: 2px; }
  input[type=checkbox] { accent-color: #f6c; margin: 0; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #f6c; }
  label span { min-width: 2.6em; opacity: .7; font-variant-numeric: tabular-nums; }
  #status { opacity: .7; flex-basis: 100%; }
  #meters { display: flex; gap: 3px; align-items: flex-end; height: 24px; }
  #meters i { width: 6px; background: #f6c; border-radius: 2px; height: 2px; }
</style>
</head>
<body>
<div id="ui">
  <button id="btnSys">Systeemaudio (scherm/tab delen)</button>
  <select id="devices"><option value="">Audio-invoer…</option></select>
  <label>Dansers <input type="range" id="count" min="1" max="24" step="1"><span id="countV"></span></label>
  <select id="cast">
    <option value="mix">Figuren: gemengd</option>
    <option value="pop">Figuren: mensen</option>
    <option value="robot">Figuren: robots</option>
    <option value="alien">Figuren: aliens</option>
    <option value="wizard">Figuren: tovenaars</option>
  </select>
  <select id="cam">
    <option value="auto">Camera: automatisch</option>
    <option value="lopen">Camera: over de dansvloer lopen</option>
    <option value="tussendoor">Camera: tussen de dansers door vliegen</option>
    <option value="laag">Camera: laag over de vloer</option>
    <option value="stilzoom">Camera: stilstaand, langzaam zoomen</option>
    <option value="dichtbij">Camera: naar een danser toe</option>
    <option value="kraan">Camera: kraan omhoog of omlaag</option>
    <option value="zijkant">Camera: langs de rand rijden</option>
    <option value="rondje">Camera: rondje om de vloer</option>
    <option value="laagrondje">Camera: laag rondje</option>
    <option value="bovenaf">Camera: van bovenaf</option>
    <option value="omdanser">Camera: rondje om een danser</option>
    <option value="voorlangs">Camera: voor de vloer langs</option>
    <option value="dj">Camera: vanaf de dj</option>
  </select>
  <select id="strobe">
    <option value="uit">Stroboscoop: uit</option>
    <option value="soms">Stroboscoop: af en toe</option>
    <option value="vaak">Stroboscoop: vaak</option>
  </select>
  <select id="floor">
    <option value="auto">Vloer: afwisselend</option>
    <option value="tegels">Vloer: tegels</option>
    <option value="fractal">Vloer: fractals</option>
  </select>
  <label>Feedback <input type="range" id="fb" min="0" max="0.92" step="0.01"><span id="fbV"></span></label>
  <label><input type="checkbox" id="mirror"> Spiegel</label>
  <label><input type="checkbox" id="mono"> Zwart-wit</label>
  <button id="btnAll">Alles willekeurig</button>
  <select id="auto">
    <option value="0">Auto-willekeurig: uit</option>
    <option value="30">Auto-willekeurig: elke 30 s</option>
    <option value="60">Auto-willekeurig: elke minuut</option>
    <option value="120">Auto-willekeurig: elke 2 minuten</option>
  </select>
  <label>Rook <input type="range" id="smoke" min="0" max="1" step="0.05"><span id="smokeV"></span></label>
  <label>Gevoeligheid <input type="range" id="sens" min="0" max="2" step="0.05"><span id="sensV"></span></label>
  <button id="btnFull">Volledig scherm</button>
  <div id="meters"><i></i><i></i><i></i></div>
  <span id="status">demo-beat (nog geen audio)</span>
</div>

<script src="lib/three.min.js"></script>
<script src="lib/Reflector.js"></script>
<script src="lib/CopyShader.js"></script>
<script src="lib/LuminosityHighPassShader.js"></script>
<script src="lib/EffectComposer.js"></script>
<script src="lib/RenderPass.js"></script>
<script src="lib/ShaderPass.js"></script>
<script src="lib/UnrealBloomPass.js"></script>
<script src="lib/GLTFLoader.js"></script>
<script src="lib/SkeletonUtils.js"></script>
<script src="lib/BVHLoader.js"></script>
<script>
const $ = id => document.getElementById(id);
const status = $('status');
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const TAU = Math.PI * 2;

// --- Instellingen ---
const S = { count: 9, cast: 'mix', cam: 'auto', sens: 1, strobe: 'soms', smoke: 0.6, mono: false, auto: 0, fb: 0, mirror: false, floor: 'auto' };
try { Object.assign(S, JSON.parse(localStorage.getItem('discoclub') || '{}')); } catch (e) {}
if (!['uit', 'soms', 'vaak'].includes(S.strobe)) S.strobe = S.strobe === 'vol' ? 'vaak' : 'soms';
function save() { try { localStorage.setItem('discoclub', JSON.stringify(S)); } catch (e) {} }

// --- Scène ---
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;  // één keer per frame, niet bij elke spiegel- en bol-opname opnieuw
// De resolutie regelen we zelf (PR), zodat renderer en bloom-keten exact dezelfde pixelmaten gebruiken
const PR = Math.min(window.devicePixelRatio || 1, 1.5);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05030a, 0.021);
const camera = new THREE.PerspectiveCamera(55, 1, 0.2, 100);  // near niet lager: vloerlagen liggen millimeters uit elkaar

let composer = null, bloom = null, grade = null, feedback = null;
if (THREE.EffectComposer && THREE.UnrealBloomPass) {
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  // Visuele feedback: het vorige beeld blijft, iets gezoomd en gedraaid, als spoor hangen. Ook het spiegeleffect zit hierin.
  feedback = new THREE.Pass();
  feedback.material = new THREE.ShaderMaterial({
    uniforms: { tNew: { value: null }, tOld: { value: null }, amount: { value: 0 }, zoom: { value: 1.02 }, rotA: { value: 0 }, mirror: { value: 0 }, aspect: { value: 1 } },
    vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `uniform sampler2D tNew, tOld; uniform float amount, zoom, rotA, mirror, aspect; varying vec2 vUv;
      void main() {
        vec2 uv = vUv;
        if (mirror > 0.5 && uv.x > 0.5) uv.x = 1.0 - uv.x;
        vec3 c = texture2D(tNew, uv).rgb;
        vec2 q = vUv - 0.5;
        q.x *= aspect;
        float cs = cos(rotA), sn = sin(rotA);
        q = mat2(cs, -sn, sn, cs) * q / zoom;
        q.x /= aspect;
        float inside = step(abs(q.x), 0.5) * step(abs(q.y), 0.5);
        gl_FragColor = vec4(max(c, texture2D(tOld, q + 0.5).rgb * amount * inside), 1.0);
      }`,
  });
  feedback.quad = new THREE.FullScreenQuad(feedback.material);
  feedback.copy = new THREE.FullScreenQuad(new THREE.MeshBasicMaterial());
  feedback.rtA = new THREE.WebGLRenderTarget(4, 4);
  feedback.rtB = new THREE.WebGLRenderTarget(4, 4);
  feedback.setSize = function (w, h) { this.rtA.setSize(w, h); this.rtB.setSize(w, h); this.material.uniforms.aspect.value = w / h; };
  feedback.render = function (renderer, writeBuffer, readBuffer) {
    const u = this.material.uniforms;
    u.tNew.value = readBuffer.texture;
    u.tOld.value = this.rtA.texture;
    renderer.setRenderTarget(this.rtB);
    this.quad.render(renderer);
    this.copy.material.map = this.rtB.texture;
    renderer.setRenderTarget(this.renderToScreen ? null : writeBuffer);
    this.copy.render(renderer);
    [this.rtA, this.rtB] = [this.rtB, this.rtA];
  };
  composer.addPass(feedback);
  bloom = new THREE.UnrealBloomPass(new THREE.Vector2(1, 1), 0.6, 0.5, 0.72);
  composer.addPass(bloom);
  // eindbewerking: kartelranden gladstrijken (FXAA), filmische contrastcurve, vignet en een beetje korrel
  grade = new THREE.ShaderPass({
    uniforms: { tDiffuse: { value: null }, res: { value: new THREE.Vector2(1, 1) }, time: { value: 0 }, mono: { value: 0 } },
    vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `uniform sampler2D tDiffuse; uniform vec2 res; uniform float time; uniform float mono; varying vec2 vUv;
      const vec3 LUMA = vec3(0.299, 0.587, 0.114);
      vec3 fxaa(vec2 uv) {
        vec2 px = 1.0 / res;
        vec3 nw = texture2D(tDiffuse, uv + vec2(-1.0, -1.0) * px).rgb, ne = texture2D(tDiffuse, uv + vec2(1.0, -1.0) * px).rgb;
        vec3 sw = texture2D(tDiffuse, uv + vec2(-1.0, 1.0) * px).rgb, se = texture2D(tDiffuse, uv + vec2(1.0, 1.0) * px).rgb;
        vec3 m = texture2D(tDiffuse, uv).rgb;
        float lnw = dot(nw, LUMA), lne = dot(ne, LUMA), lsw = dot(sw, LUMA), lse = dot(se, LUMA), lm = dot(m, LUMA);
        float lmin = min(lm, min(min(lnw, lne), min(lsw, lse))), lmax = max(lm, max(max(lnw, lne), max(lsw, lse)));
        vec2 dir = vec2(-((lnw + lne) - (lsw + lse)), (lnw + lsw) - (lne + lse));
        float reduce = max((lnw + lne + lsw + lse) * 0.03125, 0.0078125);
        dir = clamp(dir / (min(abs(dir.x), abs(dir.y)) + reduce), -8.0, 8.0) * px;
        vec3 a = 0.5 * (texture2D(tDiffuse, uv + dir * (1.0 / 3.0 - 0.5)).rgb + texture2D(tDiffuse, uv + dir * (2.0 / 3.0 - 0.5)).rgb);
        vec3 b = a * 0.5 + 0.25 * (texture2D(tDiffuse, uv - dir * 0.5).rgb + texture2D(tDiffuse, uv + dir * 0.5).rgb);
        float lb = dot(b, LUMA);
        return (lb < lmin || lb > lmax) ? a : b;
      }
      void main() {
        vec3 c = fxaa(vUv) * 1.22;
        c = c * (2.51 * c + 0.03) / (c * (2.43 * c + 0.59) + 0.14);
        c = mix(vec3(dot(c, LUMA)), c, 1.18);
        c = mix(c, vec3(smoothstep(0.02, 0.9, dot(c, LUMA) * 1.25)), mono);  // zwart-wit met wat extra contrast
        vec2 q = vUv - 0.5;
        c *= 1.0 - 0.9 * dot(q, q);
        c += (fract(sin(dot(vUv * res + time * 61.0, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) * 0.03;
        gl_FragColor = vec4(c, 1.0);
      }`,
  });
  composer.addPass(grade);
}
function resize() {
  const w = Math.floor(innerWidth * PR), h = Math.floor(innerHeight * PR);
  renderer.setSize(w, h, false);
  if (composer) composer.setSize(w, h);
  if (grade) grade.uniforms.res.value.set(w, h);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const NEON = [0xff2d95, 0x00e5ff, 0xffe600, 0x7cff00, 0xb967ff, 0xff6b00].map(c => new THREE.Color(c));
const white = new THREE.Color(0xffffff), tmpColor = new THREE.Color(), m4 = new THREE.Matrix4();
const SPH = new THREE.SphereGeometry(1, 20, 14), BOX = new THREE.BoxGeometry(1, 1, 1), CYL = new THREE.CylinderGeometry(1, 1, 1, 16), CONE = new THREE.ConeGeometry(1, 1, 20);
const additive = (color, opacity = 1) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false });
// Mesh met positie/schaal in één regel
function add(parent, geo, mat, pos, scl) {
  const m = new THREE.Mesh(geo, mat);
  if (pos) m.position.set(pos[0], pos[1], pos[2]);
  if (scl) m.scale.set(scl[0], scl[1], scl[2]);
  parent.add(m);
  return m;
}

// Zaal: donkere doos om de dansvloer
const ROOM = 14, CEIL = 7;
function canvasTexture(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); return new THREE.CanvasTexture(c); }
// wand: ruw beton met naden, vochtplekken, roestvegen en graffiti (underground)
const wallTex = canvasTexture(1024, 512, (g, w, h) => {
  g.fillStyle = '#3a3836'; g.fillRect(0, 0, w, h);
  const img = g.getImageData(0, 0, w, h), d = img.data;  // korrel
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - 0.5) * 34; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(img, 0, 0);
  for (let i = 0; i < 40; i++) {  // vlekken en vocht
    const x = rnd(0, w), y = rnd(0, h), r = rnd(20, 140), gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, pick(['rgba(10,10,12,0.35)', 'rgba(70,45,25,0.22)', 'rgba(255,255,255,0.05)'])); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  for (let i = 0; i < 26; i++) {  // druipsporen naar beneden
    const x = rnd(0, w), y = rnd(0, h * 0.5), gr = g.createLinearGradient(0, y, 0, y + rnd(60, 220));
    gr.addColorStop(0, 'rgba(15,12,10,0.35)'); gr.addColorStop(1, 'rgba(15,12,10,0)');
    g.fillStyle = gr; g.fillRect(x, y, rnd(2, 7), 240);
  }
  g.strokeStyle = 'rgba(0,0,0,0.45)'; g.lineWidth = 2;  // bekistingsnaden
  for (let x = 0; x <= w; x += 256) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
  for (const y of [170, 340]) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
  for (let x = 32; x < w; x += 128) for (const y of [85, 255, 425]) { g.fillStyle = 'rgba(0,0,0,0.5)'; g.beginPath(); g.arc(x, y, 3, 0, 7); g.fill(); }
  // graffiti: snelle tags in spuitbuskleuren
  g.lineCap = 'round'; g.lineJoin = 'round';
  for (let t = 0; t < 7; t++) {
    const cx = rnd(60, w - 160), cy = rnd(150, h - 60), col = pick(['#ff2d95', '#00e5ff', '#e8ff3c', '#ffffff', '#ff6a00', '#9b6bff']);
    g.strokeStyle = col; g.globalAlpha = rnd(0.35, 0.7); g.lineWidth = rnd(3, 7); g.shadowColor = col; g.shadowBlur = 6;
    g.beginPath(); let x = cx, y = cy; g.moveTo(x, y);
    for (let k = 0; k < 14; k++) { const nx = x + rnd(8, 22), ny = cy + rnd(-34, 18); g.quadraticCurveTo(x + rnd(-14, 14), y + rnd(-40, 40), nx, ny); x = nx; y = ny; }
    g.stroke();
    if (Math.random() < 0.5) { g.lineWidth = 2; g.beginPath(); g.moveTo(cx - 6, cy + 14); g.lineTo(x + 10, cy + 10); g.stroke(); }
  }
  g.globalAlpha = 1; g.shadowBlur = 0;
  g.fillStyle = 'rgba(8,8,10,0.85)'; g.fillRect(0, h * 0.86, w, h * 0.14);  // vuile plint
});
wallTex.wrapS = wallTex.wrapT = THREE.RepeatWrapping;
wallTex.repeat.set(3, 1);
const room = add(scene, new THREE.BoxGeometry(ROOM * 2, CEIL, ROOM * 2), new THREE.MeshStandardMaterial({ color: 0x8a8580, map: wallTex, roughness: 0.95, side: THREE.BackSide }), [0, CEIL / 2, 0]);
room.receiveShadow = true;
room.position.y -= 0.03;  // bodem van de doos net onder de spiegelvloer (y=0), anders strepen ze door elkaar
const ambient = new THREE.AmbientLight(0x554466, 1.1);
scene.add(ambient);

// Dansvloer: spiegelende ondergrond, daarboven lichtgevende tegels en een laag die de schaduwen opvangt
let mirror;
if (THREE.Reflector) mirror = new THREE.Reflector(new THREE.PlaneGeometry(ROOM * 2, ROOM * 2), { textureWidth: 1024, textureHeight: 1024, color: 0x6a6a78, clipBias: 0.003 });
else mirror = new THREE.Mesh(new THREE.PlaneGeometry(ROOM * 2, ROOM * 2), new THREE.MeshStandardMaterial({ color: 0x08080c, roughness: 0.6 }));
mirror.rotation.x = -Math.PI / 2;
scene.add(mirror);
const N = 12, tiles = new THREE.InstancedMesh(new THREE.BoxGeometry(0.94, 0.02, 0.94), additive(0xffffff), N * N);
for (let i = 0; i < N * N; i++) {
  m4.makeTranslation((i % N) - N / 2 + 0.5, 0.02, Math.floor(i / N) - N / 2 + 0.5);
  tiles.setMatrixAt(i, m4);
  tiles.setColorAt(i, tmpColor.setRGB(0, 0, 0));
}
tiles.renderOrder = 1;
scene.add(tiles);
const shadowCatcher = new THREE.Mesh(new THREE.PlaneGeometry(ROOM * 2, ROOM * 2), new THREE.ShadowMaterial({ opacity: 0.6 }));
shadowCatcher.rotation.x = -Math.PI / 2;
shadowCatcher.position.y = 0.05;
shadowCatcher.receiveShadow = true;
shadowCatcher.renderOrder = 2;
scene.add(shadowCatcher);
// Fractals als lichtbeeld: op de dansvloer (in plaats van de effen tegels) en op de led-wand achter de dj
function fractalMaterial(gridX, gridY) {
  return new THREE.ShaderMaterial({
    uniforms: { time: { value: 0 }, level: { value: 0 }, kind: { value: 0 }, colA: { value: new THREE.Color() }, colB: { value: new THREE.Color() } },
    vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `uniform float time, level; uniform int kind; uniform vec3 colA, colB; varying vec2 vUv;
      mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
      void main() {
        vec2 g = fract(vUv * vec2(${gridX.toFixed(1)}, ${gridY.toFixed(1)}));  // tegel- of pixelraster
        float mask = step(0.045, g.x) * step(g.x, 0.955) * step(0.045, g.y) * step(g.y, 0.955);
        vec2 p = (vUv - 0.5) * 2.0;
        p.x *= ${(gridX / gridY).toFixed(3)};
        float v, t;
        if (kind == 0) {  // Julia
          vec2 z = p * 1.45, c = 0.7885 * vec2(cos(time * 0.22), sin(time * 0.22));
          float it = 0.0;
          for (int i = 0; i < 48; i++) { z = vec2(z.x * z.x - z.y * z.y, 2.0 * z.x * z.y) + c; if (dot(z, z) > 16.0) break; it += 1.0; }
          float sm = it - log2(log2(dot(z, z) + 1.0001));
          v = it >= 48.0 ? 0.12 : clamp(sm / 22.0, 0.04, 1.0);
          t = sm * 0.07;
        } else if (kind == 1) {  // vouw-kaleidoscoop
          vec2 z = p;
          float tr = 1e9;
          for (int i = 0; i < 8; i++) { z = abs(z) - vec2(0.55, 0.35); z *= rot(time * 0.1 + 0.6); z *= 1.25; tr = min(tr, abs(z.x) / pow(1.25, float(i + 1))); }
          float l = log(tr + 1e-6);
          v = pow(0.5 + 0.5 * cos(l * 3.5), 2.0);
          t = l * 0.2;
        } else {  // oneindige zoom op een log-polair raster
          float r = length(p) + 1e-4;
          vec2 lp = vec2(log(r) - time * 0.28, atan(p.y, p.x) / 6.28318);
          vec2 q = abs(fract(vec2(lp.x * 1.2 + lp.y, lp.y * 8.0)) - 0.5) * 2.0;
          float tr = 1e9;
          for (int i = 0; i < 5; i++) { q = abs(q) - vec2(0.5, 0.3); q *= rot(0.9 + time * 0.05); q *= 1.35; tr = min(tr, abs(q.x) / pow(1.35, float(i + 1))); }
          float l = log(tr + 1e-6);
          v = pow(0.5 + 0.5 * cos(l * 3.5), 1.5) * smoothstep(0.0, 0.2, r);
          t = l * 0.2 + lp.x * 0.3;
        }
        gl_FragColor = vec4(mix(colA, colB, 0.5 + 0.5 * sin(t * 6.28318 + time * 0.3)) * v * mask * level, 1.0);
      }`,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
  });
}
const floorFx = new THREE.Mesh(new THREE.PlaneGeometry(N, N), fractalMaterial(N, N));
floorFx.rotation.x = -Math.PI / 2;
floorFx.position.y = 0.038;  // net boven de tegels (bovenkant 0.03), anders flikkeren ze door elkaar
floorFx.renderOrder = 1;
floorFx.visible = false;
scene.add(floorFx);
const wallFx = new THREE.Mesh(new THREE.PlaneGeometry(14.8, 5.2), fractalMaterial(56, 20));
wallFx.position.set(0, 3.3, -10.93);
scene.add(wallFx);
// ledstrips rond de vloer
const ledMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
for (const [x, z, w, d] of [[0, -6.15, 12.4, 0.1], [0, 6.15, 12.4, 0.1], [-6.15, 0, 0.1, 12.4], [6.15, 0, 0.1, 12.4]]) add(scene, BOX, ledMat, [x, 0.04, z], [w, 0.06, d]);

// Grote spiegelbol: losse vlakke spiegeltjes die de zaal echt weerspiegelen (via een rondom-camera in de bol)
const BALL_R = 1.1, ballPos = new THREE.Vector3(0, CEIL - 1.7, 0);
const envRT = new THREE.WebGLCubeRenderTarget(128), cubeCam = new THREE.CubeCamera(0.3, 40, envRT);
cubeCam.position.copy(ballPos);

      void main() { vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz);

    fragmentShader: `uniform vec3 color; uniform float strength; uniform float time; varying vec3 vN; varying vec3 vV; varying float vH; varying float vA;
      void main() { float edge = pow(abs(dot(normalize(vN), normalize(vV))), 1.6);
        float streak = 0.8 + 0.2 * sin(vA * 75.0 + time * 1.7) * sin(vA * 31.0 - time);

// Rookmachines: kastjes op de vloer die bij een climax (en om de 32 tellen) een straal rook de zaal in blazen
const FOGGERS = [[-2.6, -6.25, 0], [2.6, -6.25, 0], [-4, 6.8, Math.PI], [4, 6.8, Math.PI]].map(([x, z, ry]) => ({ x, z, dir: new THREE.Vector3(Math.sin(ry), 0, Math.cos(ry)) }));
const fogPool = [];
for (let i = 0; i < 90; i++) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: smokeTex[i % 3], color: 0x000000, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, rotation: rnd(0, TAU) }));
  sp.visible = false; scene.add(sp);

}
let fogQueue = [], lastFogBeat = -99;
function fireFog(m, dur = 1.6) {  // een stoot van ~1,6 s: elke ~0,12 s een wolkje
  for (let t = 0; t < dur; t += 0.12) fogQueue.push({ m, at: performance.now() / 1000 + t });
}
function updateFog(dt, beat, energy) {
  if (beat !== lastFogBeat && beat % 32 === 16) { const k = 1 + Math.floor(Math.random() * 2); for (let i = 0; i < k; i++) fireFog(pick(FOGGERS)); }
  if (beat !== lastFogBeat && energy > 0.75 && Math.random() < 0.04) fireFog(pick(FOGGERS), 1.0);
  lastFogBeat = beat;
  const now = performance.now() / 1000;
  fogQueue = fogQueue.filter(q => {
    if (q.at > now) return true;
    const f = fogPool.find(f => !f.sp.visible);
    if (f) {
      const m = q.m;
      f.sp.visible = true; f.age = 0; f.life = rnd(6, 10); f.s0 = rnd(0.8, 1.2);
      f.sp.position.set(m.x + m.dir.x * 0.3, 0.35, m.z + m.dir.z * 0.3);
      f.v.copy(m.dir).multiplyScalar(rnd(3.5, 5)).add(new THREE.Vector3(rnd(-0.6, 0.6), rnd(0.1, 0.5), rnd(-0.6, 0.6)));
    }
    return false;
  });
  for (const f of fogPool) {
    if (!f.sp.visible) continue;
    f.age += dt;
    if (f.age > f.life) { f.sp.visible = false; continue; }
    f.v.multiplyScalar(Math.exp(-dt * 1.4));  // remt af en blijft laag hangen
    f.sp.position.addScaledVector(f.v, dt);
    const sc = f.s0 + f.age * 1.4;
    f.sp.scale.set(sc * 1.4, sc, 1);
    const p = f.sp.position;
    f.lit.setRGB(0.05, 0.045, 0.06);
    for (const s of spots) { const d = distToBeam(p, s.beam.g.position, s.beam.target); addColor(f.lit, s.light.color, s.beam.mat.uniforms.strength.value * 0.6 * Math.exp(-d * d * 0.35)); }
    for (const h of heads) { const d = distToBeam(p, h.beam.g.position, h.beam.target); addColor(f.lit, h.beam.mat.uniforms.color.value, h.beam.mat.uniforms.strength.value * 0.45 * Math.exp(-d * d * 1.4)); }
    const fade = Math.min(1, f.age * 3) * (1 - f.age / f.life);
    const peak = Math.max(f.lit.r, f.lit.g, f.lit.b);
    if (peak > 0.3) f.lit.multiplyScalar(0.3 / peak);  // nooit een witte muur onder een felle spot
    f.sp.material.color.copy(f.lit).multiplyScalar(fade * 0.3 * (0.4 + S.smoke));
  }
}

  for (let i = 0; i < BARS; i++) {
    const h = 0.15 + 3.6 * spectrum(i);
    m4.makeScale(1, h, 1).setPosition((i - BARS / 2 + 0.5) * 0.52, 2.2 + h / 2, -10.85);
    bars.setMatrixAt(i, m4);
    bars.setColorAt(i, tmpColor.copy(pal[0]).lerp(pal[1], i / (BARS - 1)).multiplyScalar((0.4 + 0.4 * pulse) * (strobing ? 0.3 : 1)));
  }
  bars.instanceMatrix.needsUpdate = true;
  bars.instanceColor.needsUpdate = true;
  for (const s of speakers) s.scale.setScalar(1 + 0.25 * bass * pulse);
  wallBars.forEach((w, i) => {
    const lvl = bands[i % 3].v;
    w.scale.y = 0.6 + 3.4 * lvl;
    w.material.color.copy(pal[i & 1]).multiplyScalar((0.15 + 0.75 * lvl) * L.wash * dim);
  });

  // spots: zwieren over de vloer
  spots.forEach((s, i) => {
    const a = now * (0.5 + 0.13 * i) + i * 1.7, r = 3 + 2 * Math.sin(now * 0.31 + i);
    s.light.target.position.set(r * Math.cos(a), 0, r * Math.sin(a));
    s.light.intensity = (0.9 + 1.5 * hit + 0.5 * mid) * L.spots * dim;
    s.light.color.lerp(pal[i & 1], 0.1);
    s.beam.aim(s.light.target.position);
    s.beam.mat.uniforms.color.value.copy(s.light.color);
    s.beam.mat.uniforms.strength.value = (0.12 + 0.3 * hit + 0.1 * treble) * L.spots * dim;
    s.beam.mat.uniforms.time.value = now;
  });
  // moving heads: elke 4 beats de volgende formatie van de huidige lichtstand, snel maar vloeiend erheen
  const formation = cue.forms[(beat >> 2) % cue.forms.length];
  heads.forEach((h, i) => {
    h.cur.lerp(headTarget(h, i, formation, now), 1 - Math.exp(-dt * 7));
    h.beam.aim(h.cur);
    const u = h.beam.mat.uniforms;
    u.color.value.lerp(pal[(i + 1) & 1], 0.15);
    u.strength.value = (energy < 0.1 ? 0.05 : 0.25 + 0.55 * hit + 0.15 * treble) * L.heads * dim;
    u.time.value = now + i;
    h.lens.material.color.copy(u.color.value).lerp(white, 0.5).multiplyScalar(Math.min(1, L.heads + 0.1));
  });
  // lasers: alleen in de laser-lichtstand; waaier die open en dicht gaat
  const lasersOn = energy > 0.3 && L.lasers > 0.5 && !strobing;
  for (const l of lasers) {
    l.g.visible = lasersOn;
    if (!lasersOn) continue;
    l.g.rotation.set(0.42 + 0.22 * Math.sin(now * 0.7), -l.side * (0.45 + 0.3 * Math.sin(now * 0.5)), 0);
    const spread = 0.02 + 0.09 * (0.5 + 0.5 * Math.sin(beatPos * Math.PI / 2));
    l.rays.forEach((r, i) => r.rotation.y = (i - 4) * spread);
    l.mat.color.copy(pal[l.side > 0 ? 1 : 0]).lerp(white, 0.15);
    l.mat.opacity = 0.45 + 0.55 * pulse;
  }
  strobeLight.intensity = flash * 6;
  strobeMat.color.setScalar(flash);
  if (bloom) bloom.strength = 0.5 + 0.35 * hit * dim + 0.35 * flash;
  if (feedback) {
    feedback.enabled = S.fb > 0.01 || S.mirror;
    const u = feedback.material.uniforms;
    u.amount.value = S.fb;
    u.zoom.value = 1.02 + 0.012 * Math.sin(now * 0.21);
    u.rotA.value = 0.006 * Math.sin(now * 0.13);
    u.mirror.value = S.mirror ? 1 : 0;
  }
  if (grade) { grade.uniforms.time.value = now; grade.uniforms.mono.value = S.mono ? 1 : 0; }
  if (S.auto > 0 && now > autoNext) { randomizeAll(); autoNext = now + S.auto; }

  // spiegelbol
  ball.rotation.y += dt * 0.3;
  glintMat.opacity = 0.3 + 0.7 * treble;
  updateFlecks(ball.rotation.y, (0.45 + 0.5 * treble + 0.3 * hit) * L.flecks * (strobing ? 0.3 : 1));
  updateSmoke(dt);
  updateFog(dt, beat, energy);

  // dansers
  for (const d of dancers) {
    pose(d, beatPos, energy, dt);
    if (d.light) d.light.material.color.setHSL(0.52, 1, 0.25 + 0.5 * pulse);
  }
  pose(dj, beatPos, energy * 0.7, dt);
  for (const c of crowd) pose(c, beatPos, energy * 0.4, dt);
  updateWalkers(dt, beatPos, energy);
  for (const d of poleDancers) d.mixer.update(dt);
  washMats.forEach((m, i) => m.color.copy(pal[i & 1]).multiplyScalar((0.25 + 0.45 * bands[i].v) * L.wash * dim));
  pillarLed.color.copy(pal[(beat >> 1) & 1]).multiplyScalar((0.2 + 0.8 * hit) * dim);

  updateCamera(now);

  renderer.shadowMap.needsUpdate = true;
  // de bol weerspiegelt de zaal: elke derde frame de rondom-opname verversen (zonder bol en spiegelvloer in beeld)
  if (frameNo++ % 3 === 0) {
    ball.visible = false; mirror.visible = false;
    cubeCam.update(renderer, scene);
    ball.visible = true; mirror.visible = true;
  }
  if (composer) composer.render(); else renderer.render(scene, camera);
  meters.forEach((el, i) => el.style.height = (2 + bands[i].v * 22) + 'px');
  requestAnimationFrame(frame);
}

// --- UI ---
function syncUI() {
  $('count').value = S.count; $('countV').textContent = S.count;
  $('cast').value = S.cast; $('cam').value = S.cam; $('strobe').value = S.strobe;
  $('mono').checked = S.mono; $('auto').value = S.auto; $('mirror').checked = S.mirror; $('floor').value = S.floor;
  $('fb').value = S.fb; $('fbV').textContent = Math.round(S.fb * 100) + '%';
  $('smoke').value = S.smoke; $('smokeV').textContent = Math.round(S.smoke * 100) + '%';
  $('sens').value = S.sens; $('sensV').textContent = Math.round(S.sens * 100) + '%';
}
$('count').oninput = e => { S.count = +e.target.value; syncUI(); save(); buildCast(); };
$('cast').onchange = e => { S.cast = e.target.value; save(); buildCast(); };
$('cam').onchange = e => { S.cam = e.target.value; save(); };
$('strobe').onchange = e => { S.strobe = e.target.value; save(); };
$('mirror').onchange = e => { S.mirror = e.target.checked; save(); };
$('floor').onchange = e => { S.floor = e.target.value; save(); };
$('fb').oninput = e => { S.fb = +e.target.value; syncUI(); save(); };
$('mono').onchange = e => { S.mono = e.target.checked; save(); };
$('btnAll').onclick = () => { randomizeAll(); autoNext = performance.now() / 1000 + S.auto; };
$('auto').onchange = e => { S.auto = +e.target.value; autoNext = performance.now() / 1000 + S.auto; save(); };
$('smoke').oninput = e => { S.smoke = +e.target.value; syncUI(); save(); };
$('sens').oninput = e => { S.sens = +e.target.value; syncUI(); save(); };
$('btnFull').onclick = () => {
  if (inApp) window.webkit.messageHandlers.app.postMessage('fullscreen');
  else document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
};
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey) return;
  const inControl = /^(INPUT|SELECT)$/.test(e.target.tagName);
  if (inApp && !inControl) e.preventDefault();
  if (inControl && e.key.startsWith('Arrow')) return;
  const k = e.key.toLowerCase();
  if (k === 'h') $('ui').classList.toggle('hidden');
  if (k === 'f') $('btnFull').click();
  if (k === 'n') buildCast();  // nieuwe bezetting
  if (k === 'b') { S.mono = !S.mono; syncUI(); save(); }
  if (k === 'x') $('btnAll').click();
  if (k === 'v') { const o = ['auto', 'tegels', 'fractal']; S.floor = o[(o.indexOf(S.floor) + 1) % 3]; syncUI(); save(); }
  if (k === 's') { const o = ['uit', 'soms', 'vaak']; S.strobe = o[(o.indexOf(S.strobe) + 1) % 3]; syncUI(); save(); }
  if (k === 'c') { const o = ['auto', ...SHOT_KINDS]; S.cam = o[(o.indexOf(S.cam) + 1) % o.length]; syncUI(); save(); }
  if (k === ' ') shot = null;  // spatie: direct een ander shot
});
// Paneel en muiswijzer verdwijnen na 10 s zonder muisbeweging
let idleTimer;
function wake() {
  $('ui').classList.remove('hidden');
  document.body.style.cursor = '';
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { $('ui').classList.add('hidden'); document.body.style.cursor = 'none'; }, 10000);
}
for (const ev of ['mousemove', 'mousedown', 'wheel']) addEventListener(ev, wake);
wake();

syncUI();
buildClub();
buildCast();
requestAnimationFrame(frame);
</script>
